services:
  openvpn:
    build:
      context: .
      dockerfile: Dockerfile.openvpn
    image: openvpn:local
    command: /etc/openvpn/setup/configure.sh
    environment:
      OVPN_ROLE: "slave"
      # the slave receives CCD files (static client addresses) from the master, so the pools must match docker-compose.yaml
      OVPN_SERVER_NET: "192.168.100.0"
      OVPN_SERVER_MASK: "255.255.255.0"
      OVPN_SERVER_NET6: "fd00:192:168:100::/64"
      OVPN_PROTO: "tcp6"
    cap_add:
      - NET_ADMIN
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.forwarding: 1
    networks:
      - ovpn
    ports:
      - 7778:1194 # for openvpn
      - 8081:8080 # for ovpn-admin because of network_mode
    volumes:
      - ./easyrsa_slave:/etc/openvpn/easyrsa
      - ./ccd_slave:/etc/openvpn/ccd
  ovpn-admin:
    build:
      context: .
      dockerfile: Dockerfile.ovpn-admin
    image: ovpn-admin:local
    command: /app/ovpn-admin --log.level="debug" --ovpn.network="192.168.100.0/24" --ovpn.network.ipv6="fd00:192:168:100::/64" --master.sync-token="TOKEN" --master.host="http://172.20.0.1:8080" --role="slave" --ovpn.server="127.0.0.1:7777:tcp" --ovpn.server="127.0.0.1:7778:tcp" --easyrsa.path="/mnt/easyrsa" --easyrsa.index-path="/mnt/easyrsa/pki/index.txt" --ccd.path="/mnt/ccd"
    environment:
      - OVPN_SLAVE=1
    network_mode: service:openvpn
    volumes:
      - ./easyrsa_slave:/mnt/easyrsa
      - ./ccd_slave:/mnt/ccd

networks:
  ovpn:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1
        - subnet: fd00:172:21::/64
          gateway: fd00:172:21::1
