{{- $openvpnNetwork := required "A valid .Values.openvpn.subnet entry required!" .Values.openvpn.subnet }}
{{- $openvpnNetworkParts := splitList "/" $openvpnNetwork }}
{{- /* OpenVPN "server" takes a dotted netmask: a prefix length (172.16.200.0/24) would break the config */}}
{{- if or (ne (len $openvpnNetworkParts) 2) (not (contains "." (index $openvpnNetworkParts 1))) }}
{{- fail "openvpn.subnet must be in the address/netmask format, e.g. 172.16.200.0/255.255.255.0" }}
{{- end }}
{{- $openvpnNetworkAddress := index $openvpnNetworkParts 0 }}
{{- $openvpnNetworkNetmask := index $openvpnNetworkParts 1 }}
{{- $openvpnNetworkIPv6 := .Values.openvpn.subnetIPv6 | default "" }}
{{- if and $openvpnNetworkIPv6 (not (contains "/" $openvpnNetworkIPv6)) }}
{{- fail "openvpn.subnetIPv6 must be in the CIDR format, e.g. fd00:16:200::/64" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openvpn
data:
  openvpn.conf: |-
    user nobody
    group nogroup

    mode server
    tls-server
    # dev-type tun
    dev tun
    proto {{ if .Values.openvpn.dualStack }}tcp6-server{{ else }}tcp-server{{ end }}
    port 1194
    # local 127.0.0.1
    management 127.0.0.1 8989

    tun-mtu 1500
    mssfix
    # only udp
    #fragment 1300

    keepalive 10 60
    client-to-client
    persist-key
    persist-tun

    cipher AES-128-CBC
    duplicate-cn

    server {{ $openvpnNetworkAddress }} {{ $openvpnNetworkNetmask }}
    {{- with $openvpnNetworkIPv6 }}
    server-ipv6 {{ . }}
    {{- end }}

    topology subnet
    push "topology subnet"
    push "route-metric 9999"

    verb 4

    ifconfig-pool-persist /tmp/openvpn.ipp
    status /tmp/openvpn.status

    key-direction 0

    ca /etc/openvpn/certs/pki/ca.crt
    key /etc/openvpn/certs/pki/private/server.key
    cert /etc/openvpn/certs/pki/issued/server.crt
    dh /etc/openvpn/certs/pki/dh.pem
    crl-verify /etc/openvpn/certs/pki/crl.pem
    tls-auth /etc/openvpn/certs/pki/ta.key
    client-config-dir /etc/openvpn/ccd

  entrypoint.sh: |-
    #!/bin/sh
    set -x

    iptables -t nat -D POSTROUTING -s {{ $openvpnNetworkAddress }}/{{ $openvpnNetworkNetmask }} ! -d {{ $openvpnNetworkAddress }}/{{ $openvpnNetworkNetmask }} -j MASQUERADE || true
    iptables -t nat -A POSTROUTING -s {{ $openvpnNetworkAddress }}/{{ $openvpnNetworkNetmask }} ! -d {{ $openvpnNetworkAddress }}/{{ $openvpnNetworkNetmask }} -j MASQUERADE
    {{- with $openvpnNetworkIPv6 }}

    ip6tables -t nat -D POSTROUTING -s {{ . }} ! -d {{ . }} -j MASQUERADE || true
    ip6tables -t nat -A POSTROUTING -s {{ . }} ! -d {{ . }} -j MASQUERADE

    if [ "$(cat /proc/sys/net/ipv6/conf/all/forwarding 2>/dev/null)" != "1" ]; then
      if ! sysctl -w net.ipv6.conf.all.forwarding=1; then
        echo "WARNING: cannot enable IPv6 forwarding (/proc/sys is read-only), IPv6 traffic of VPN clients is not routed." \
          "Set the net.ipv6.conf.all.forwarding=1 sysctl via podSecurityContext of the chart." >&2
      fi
    fi
    {{- end }}

    mkdir -p /dev/net
    if [ ! -c /dev/net/tun ]; then
        mknod /dev/net/tun c 10 200
    fi

    wait_file() {
      file_path="$1"
      while true; do
        if [ -f $file_path ]; then
          break
        fi
        echo "wait $file_path"
        sleep 2
      done
    }

    easyrsa_path="/etc/openvpn/certs"

    wait_file "$easyrsa_path/pki/ca.crt"
    wait_file "$easyrsa_path/pki/private/server.key"
    wait_file "$easyrsa_path/pki/issued/server.crt"
    wait_file "$easyrsa_path/pki/ta.key"
    wait_file "$easyrsa_path/pki/dh.pem"
    wait_file "$easyrsa_path/pki/crl.pem"

    openvpn --config /etc/openvpn/openvpn.conf
